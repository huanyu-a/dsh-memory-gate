# Applied by the profile composer (dsh.bundle.patch) when this package is
# added to a profile. Mounts the host half (the `memory-gate` identities plus
# the per-request identity-header gate) so the browser scanner discovers
# `dsh.client` and serves `lib/client.js` as
# `/plugins/dsh-memory-header-gate/client.js`.
#
# The row id is `memory-gate` — NOT the package name — because on DSH 0.1.7+
# the row id doubles as the plugin's settings namespace (the key the settings
# Remote and the settings/document-updated event address it by). Keeping the
# namespace name separate from the package name means the settings document
# this plugin writes stays addressable even if the package is renamed.
- insert:
    - id: memory-gate
      name: dsh-memory-header-gate